---
openapi: 3.0.1
info:
  title: Trefle API v1
  version: 2.7.0
  description: |-
    A REST API over a global plants database: taxonomy, botanical traits, distribution zones and images.

    Every endpoint but `GET /api/v1` requires a token, passed either as a `token` query parameter or as `Authorization: Bearer <token>`. Claim one with `POST /api/auth/claim`.

    Trefle compiles data from external sources; each record lists the sources it was built from, with their own licence. Attribution is required — see https://trefle.io/citation.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
paths:
  "/api/v1":
    get:
      summary: API status
      tags:
      - Root
      description: Public database counters. This is the only endpoint that does not
        require a token.
      operationId: getApiStatus
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/api_status"
  "/api/v1/me":
    get:
      summary: Retrieve the token owner
      tags:
      - Root
      description: The profile of the account the token belongs to. `name`, `email`
        and `created_at` are null when authenticating with a JWT.
      operationId: getMe
      security:
      - token: []
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/user_profile"
        '401':
          description: Invalid credentials
