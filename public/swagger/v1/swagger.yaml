              schema:
                type: object
                description: An OpenAPI 3.0 document
                required:
                - openapi
                - info
                - paths
                properties:
                  openapi:
                    type: string
                    example: 3.0.1
                  info:
                    type: object
                  paths:
                    type: object
            application/yaml:
              schema:
                type: object
                description: An OpenAPI 3.0 document
                required:
                - openapi
                - info
                - paths
                properties:
                  openapi:
                    type: string
                    example: 3.0.1
                  info:
