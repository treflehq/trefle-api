  "/auth/claim":
    servers:
    - url: https://trefle.io/api
    post:
      summary: Request a client-side token
      tags:
      - Auth
      description: |
        If you need to perform client-side requests, request a client-side token from your backend and get a JWT in return. That token is usable on the client side, in place of your account token, for 24 hours.

        This call needs your secret account token, as `Authorization: Bearer <token>` or as the `token` query parameter, the origin of the website the client-side requests will come from, and optionally the end user's IP address. A client-side token cannot claim another one.

        Requests made with a client-side token count against the rate limit of the account that claimed it.
      operationId: claimClientSideToken
      security:
      - token: []
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_at:
                    type: string
                    format: date-time
                    example: '2020-07-13T13:41:00Z'
                    description: When the token expires, in ISO 8601 UTC. After this
                      time, request a new one
                  expiration:
                    type: string
                    deprecated: true
                    example: 07-13-2020 13:41
                    description: 'Deprecated: the expiration time formatted month-day-year,
                      without a time zone. Read `expires_at` instead'
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NaJ9.eyJ1c2VyX2lkIjoxMDYsIe9yaWdpbiI6Imh0dHA6Ly9wb2NhbGhvc3Q6MzIzMyIsImlwIjoiOjoxIiwiZXhwIjoxNTk0NjQwNTEzfQ.TyqKyKxwsnn7TZsLAfS8OTmTUPk87CSXlk6a2wQU9co
                    description: The client-side access token, that you'll use instead
                      of your access token in the `token` parameter
                required:
                - token
                - expires_at
                - expiration
        '401':
          description: Missing or invalid account token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: Missing origin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '429':
          description: 'Too many requests: the rate limit is exceeded'
          headers:
            RateLimit-Limit:
              schema:
                type: integer
              description: Requests allowed per minute
            RateLimit-Remaining:
              schema:
                type: integer
              description: Requests left in the current minute
            RateLimit-Reset:
              schema:
                type: integer
              description: Unix timestamp at which the counter resets
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                origin:
                  type: string
                  example: https://example.com
                  description: The origin (scheme, host and port) of the website the
                    client-side requests will come from, as browsers send it in the
                    `Origin` header. A request whose `Origin` header differs is refused.
                ip:
                  type: string
                  nullable: true
                  example: 12.23.34.45
                  description: 'Optional: the IP address of the end user. When given,
                    the token only works from that address.'
              required:
              - origin
        required: true
