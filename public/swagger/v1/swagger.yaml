  "/api/v1/corrections/{record_type}/{record_id}":
    post:
      summary: Submit a correction
      tags:
      - Corrections
      description: Submit a new correction for the given record, that will be reviewed
        and merged into the database. See [Complete our data](/docs/advanced/complete-data)
        to get started.
      operationId: createCorrection
      parameters:
      - name: record_type
        required: true
        in: path
        schema:
          type: string
          enum:
          - species
          - plant
          - plants
        description: The type of record being corrected
      - name: record_id
        required: true
        in: path
        description: The id or the slug of the record being corrected
        schema:
          type: string
      security:
      - token: []
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
