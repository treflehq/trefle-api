                "$ref": "#/components/schemas/error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'The account access token, or the JWT claimed with `POST /api/auth/claim`,
        as `Authorization: Bearer <token>`'
    token:
      type: apiKey
      name: token
      in: query
      description: The same token as a `token` query parameter, for clients that cannot
        set headers
  parameters:
    page:
      name: page
      in: query
      required: false
      description: 'The page to fetch, starting at 1. `/species` and `/plants` cap
        it at 2500 and answer 400 beyond: narrow the results with a filter or a range
        instead of paging through the whole collection.'
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      required: false
      description: Items per page, 20 by default, at most 100. `limit` is accepted
        as an alias. Out of range or not an integer answers 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    q:
      name: q
      in: query
      required: true
      description: 'The text to search for: a scientific name, a common name, a synonym,
        an author, a genus or a family name'
      schema:
        type: string
      example: coconut
    zone_q:
      name: q
      in: query
      required: false
      description: Search zones by name (part of the name, case- and accent-insensitive).
        Exact matches come first.
      schema:
        type: string
      example: Europe
    filter_species:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: 'Keep the records whose field equals the value: `filter[field]=value`.
        Several values separated by commas match any of them (`filter[flower_color]=red,yellow`).
        Boolean fields accept true, yes, 1, on, false, no, 0 and off. Fields with
        a closed set of values (status, rank, establishment, duration, colours, months...)
        list it below and match it case-insensitively; another value answers 400.
        Numeric fields are filtered with `range[field]`. One key per filterable field;
        an unknown key answers 400.'
      schema:
        type: object
        properties:
          author:
            type: string
            example: L.
          biological_type:
            type: string
            description: 'One of: phanerophyte, megaphanerophyte, macrophanerophyte,
              nanophanerophyte, hemiphanerophyte, pseudophanerophyte, chamaephyte,
              hemicryptophyte, cryptophyte, geophyte, helophyte, hydrophyte, therophyte,
              epiphyte. Several, separated by commas, match any of them.'
            example: phanerophyte
          bloom_months:
            type: string
            description: 'One of: jan, feb, mar, apr, may, jun, jul, aug, sep, oct,
              nov, dec. Several, separated by commas, match any of them.'
            example: may,jun
          common_name:
            type: string
            example: tomato
          complete_data:
            type: string
            description: true or false (also yes/no, 1/0, on/off).
            example: 'true'
          completion_ratio:
            type: string
            example: '100'
          duration:
            type: string
            description: 'One of: annual, biennial, perennial. Several, separated
              by commas, match any of them.'
            example: perennial
          establishment:
            type: string
            description: 'One of: native, introduced, doubtful, absent, extinct. Several,
              separated by commas, match any of them.'
            example: native
          edible:
            type: string
            description: true or false (also yes/no, 1/0, on/off).
            example: 'true'
          edible_part:
            type: string
            description: 'One of: roots, stem, leaves, flowers, fruits, seeds, tubers.
              Several, separated by commas, match any of them.'
            example: fruits,leaves
          family_common_name:
            type: string
            example: Rose family
          family_name:
            type: string
            example: Rosaceae
          flower_color:
            type: string
            description: 'One of: white, red, brown, orange, yellow, lime, green,
              cyan, blue, purple, magenta, grey, black. Several, separated by commas,
              match any of them.'
            example: red,yellow
