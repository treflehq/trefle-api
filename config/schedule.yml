

migrate_synonyms:
  cron: "0 0 */15 * *" # At 00:00 on every 15th day-of-month.
  class: "Migrators::SynonymsWorker"
  queue: migrations

migrate_queries_counters:
  cron: "*/10 * * * *" # At every 10th minute
  class: "UserQueryWorker"
  queue: low

reindex_species:
  cron: "*/30 * * * *" # At every 30th minute
  class: "Search::ReindexSpeciesWorker"
  queue: reindex

update_sponsors:
  cron: "*/15 * * * *" # At every 15th minute
  class: "Sponsorship::UpdateSponsorWorker"
  queue: low

checks_sweep:
  cron: "15 * * * *" # hourly, 200 least recently checked species
  class: "ChecksSweepWorker"
  queue: checks

check_species_images:
  cron: "0 0 */7 * *" # At 00:00 on every 7th day-of-month.
  class: "Migrators::ImagesFixerWorker"
  queue: migrations

api_sweep:
  # Replaces the standalone heater service, then the narrower cache warmer.
  # Each run covers the whole *shape* of the API (every collection crossed with
  # every filter and order key it accepts — this is what catches an endpoint
  # that started returning 500), the *hot* records, and a slice of the *depth*:
  # every index page and every record, resuming from a cursor in Redis.
  # Measured: ~955 paths in ~90s. A full depth cycle is ~973k paths, so at 500
  # per run every 20 minutes the sweep sees the entire API every ~27 days.
  cron: "*/20 * * * *" # every 20 minutes
  class: "ApiSweepWorker"
  queue: low

quality_snapshot:
  # Daily: while the dataset is actively being filled, a weekly point is too
  # coarse to see whether a change helped. One snapshot is ~60 rows.
  cron: "30 2 * * *" # every day at 02:30
  class: "QualitySnapshotWorker"
  queue: low
