# Publishes the generated OpenAPI spec to treflehq/documentation, which serves
# it through Redoc at docs.trefle.io/reference.
#
# The copy used to be a manual gesture, and it was last made in December 2020:
# the published reference described the API as it stood five years earlier. This
# opens the pull request automatically instead, so the drift can only be as long
# as the PR stays unmerged.
#
# Requires a DOCS_SYNC_TOKEN secret: a token with `contents: write` and
# `pull_requests: write` on treflehq/documentation. Without it the job fails
# loudly rather than silently skipping, which is the point.
name: Sync OpenAPI spec to docs

on:
  push:
    branches: [master]
    paths: ['public/swagger/v1/swagger.yaml']
  workflow_dispatch:

jobs:
  sync:
    name: Open a PR on treflehq/documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the API
        uses: actions/checkout@v7
        with:
          path: api

      - name: Check out the docs
        uses: actions/checkout@v7
        with:
          repository: treflehq/documentation
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          path: documentation

      - name: Copy the spec and open a pull request
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          API_SHA: ${{ github.sha }}
        working-directory: documentation
        run: |
          set -euo pipefail

          cp ../api/public/swagger/v1/swagger.yaml static/swagger.yaml

          if git diff --quiet -- static/swagger.yaml; then
            echo "The published spec already matches trefle-api. Nothing to do."
            exit 0
          fi

          version=$(sed -n 's/^  version: //p' static/swagger.yaml | head -1)
          branch="openapi-sync/${API_SHA::7}"

          git config user.name 'trefle-bot'
          git config user.email 'bot@trefle.io'
          git checkout -b "$branch"
          git add static/swagger.yaml
          git commit -m "Reference: sync the OpenAPI spec (${version})"
          git push --force-with-lease origin "$branch"

          # An open PR for this branch may already exist on a re-run.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Reference: sync the OpenAPI spec (${version})" \
              --body "Generated by \`rake rswag:specs:swaggerize\` at treflehq/trefle-api@${API_SHA}.

          The reference at docs.trefle.io/reference is rendered by Redoc from \`static/swagger.yaml\`. This PR brings it in step with the API; do not hand-edit the file, the change belongs in the rswag request specs under \`spec/requests/api/v1/\` in trefle-api." \
              --base master \
              --head "$branch"
          else
            echo "A pull request for $branch is already open; pushed the update to it."
          fi
